* { box-sizing: border-box; }

    <h1>공식과 단위 유도</h1>
    <p>단위는 외우지 말고 정의식에서 끌어낸다. 카드마다 식, 단위, 단위가 나오는 과정을 붙였고, 교수님이 "유도 과정을 알아 두라"고 한 식은 유도까지 넣었다.</p>
  </header>

    <div class="tabs" role="tablist" aria-label="탭" id="tabs"></div>
    <div class="tools">
      <button class="toggle" id="drill" type="button" aria-pressed="false">식 가리고 외우기</button>
      <button class="toggle" id="openAll" type="button" aria-pressed="false">유도 전부 펼치기</button>
    </div>
  </div>

  <main id="main"></main>

  <footer>슬라이드 22~27장과 강의 녹취를 기준으로 정리했다. 단위 유도는 SI 기본 관계(N = kg·m/s², J = N·m, C = A·s, V = J/C)에서 출발한다.</footer>
</div>

      m: '부호: 저항을 전류 방향으로 지나면 −IR, 반대면 +IR. 전지를 −→+로 지나면 +ε, +→−면 −ε.',
      w: '연습 27장 20(22): 13.0I₁ + 18.0I₂ = 30.0, 18.0I₂ − 5.00I₃ = −24.0, I₁ = I₂ + I₃ → I₁ = 2.88 A, I₂ = −0.416 A(실제 방향 반대), I₃ = 3.30 A',
      p: '문제에 그려진 화살표 방향을 그대로 쓴다. 고치지 마라 (10/15).' },
    { ch: 27, t: '시간 상수', star: true, f: '\\[\\tau = RC\\]', u: 's',
      d: '\\(\\Omega\\cdot\\mathrm F = \\dfrac{\\mathrm V}{\\mathrm A}\\cdot\\dfrac{\\mathrm C}{\\mathrm V} = \\dfrac{\\mathrm C}{\\mathrm A} = \\dfrac{\\mathrm C}{\\mathrm{C/s}} = \\mathrm s\\)',
      w: '연습 27장 23(25): 닫기 전 \\(\\tau = (R_1 + R_2)C = 1.50\\ \\mathrm s\\), 닫은 후 \\(\\tau = R_2C = 1.00\\ \\mathrm s\\)',
      p: '"시상수 구하세요"가 첫 질문일 수 있다. RC가 시간 차원이라는 것도 보여 줄 수 있어야.' },
    { ch: 27, t: 'RC 충전', star: true, f: '\\[q(t) = C\\varepsilon\\left(1 - e^{-t/RC}\\right),\\qquad I(t) = \\frac{\\varepsilon}{R}e^{-t/RC}\\]', u: 'C · A',
      d: '\\(C\\varepsilon:\\ \\mathrm F\\cdot\\mathrm V = \\mathrm C\\). \\(\\varepsilon/R:\\ \\mathrm V/\\Omega = \\mathrm A\\). 지수 \\(t/RC\\)는 s/s → 단위 없음(지수 안은 반드시 무차원).',
      m: 't = τ에서 최대 전하의 약 63%. 다 차면 전류 0 (등전위, 끊긴 것과 같음).',
      p: '수식을 안 줄 수도 있다 → 결과식 암기. 1계 미분방정식 유도까지 시키지는 않는다 (10/15).',
      x: ['고리 법칙: \\(\\varepsilon - \\dfrac qC - IR = 0\\), \\(I = \\dfrac{dq}{dt}\\)', '변수 분리: \\(\\dfrac{dq}{q - C\\varepsilon} = -\\dfrac{dt}{RC}\\)', '적분: \\(\\ln\\dfrac{q - C\\varepsilon}{-C\\varepsilon} = -\\dfrac{t}{RC}\\) → \\(q = C\\varepsilon(1 - e^{-t/RC})\\)', '미분: \\(I = \\dfrac{dq}{dt} = \\dfrac{\\varepsilon}{R}e^{-t/RC}\\)'] },
    { ch: 27, t: 'RC 방전', star: true, f: '\\[q(t) = Qe^{-t/RC},\\qquad I(t) = -\\frac{Q}{RC}e^{-t/RC}\\]', u: 'C · A',
      d: '\\(\\dfrac{Q}{RC}:\\ \\dfrac{\\mathrm C}{\\mathrm s} = \\mathrm A\\)',
      x: ['고리 법칙: \\(-\\dfrac qC - IR = 0\\) → \\(\\dfrac{dq}{q} = -\\dfrac{dt}{RC}\\)', '\\(\\int_Q^q\\dfrac{dq}{q} = -\\dfrac{1}{RC}\\int_0^tdt\\) → \\(q = Qe^{-t/RC}\\)'] },
    { ch: 27, t: '방전 비율 문제 (예제 27.8)', f: '\\[\\frac{Q}{4} = Qe^{-t/RC}\\Rightarrow t = RC\\ln4 = 1.39\\tau;\\qquad U\\propto q^2:\\ \\frac14 = e^{-2t/RC}\\Rightarrow t = \\tfrac12RC\\ln4 = 0.693\\tau\\]', u: 's',
      d: '\\(\\ln\\)은 단위 없음 × RC(s) = s', m: '지수를 없애려면 양변에 ln을 취한다. ln 2 ≈ 0.693, ln 3 ≈ 1.10, ln 4 ≈ 1.39.' },
    { ch: 27, t: '저항에서 소모된 에너지 (예제 27.9)', f: '\\[E_R = \\int_0^\\infty I^2R\\,dt = \\tfrac12C\\varepsilon^2\\]', u: 'J',
      d: '\\(\\mathrm A^2\\cdot\\Omega\\cdot\\mathrm s = \\mathrm W\\cdot\\mathrm s = \\mathrm J\\)', m: '축전기에 저장됐던 에너지가 전부 저항에서 열로 나간다. 충전할 때는 전지가 준 에너지의 절반이 저항, 절반이 축전기(연습 27장 30(44)).' }
  ];

  /* ---------------- 요약(시험 직전) ---------------- */
  const SHEET = [
    { h: '22 전기장', items: [['쿨롱', '\\(F = k_e\\dfrac{|q_1||q_2|}{r^2}\\) [N], \\(k_e = 8.99\\times10^9\\ \\mathrm{N\\,m^2/C^2}\\)'], ['전기장', '\\(E = F/q_0 = k_eq/r^2\\) [N/C = V/m]'], ['22.5 속력 (3가지 방법)', '\\(v = \\sqrt{2qEd/m}\\) [m/s] — 힘 / W = ΔK / ΔK + ΔU = 0']] },
    { h: '23 가우스', items: [['가우스', '\\(\\oint\\vec E\\cdot d\\vec A = q_{\\text{in}}/\\varepsilon_0\\) [N·m²/C]'], ['구', '밖 \\(k_eQ/r^2\\), 안 \\(k_eQr/a^3\\)'], ['직선 · 평면 · 평행판', '\\(\\lambda/2\\pi\\varepsilon_0r\\) · \\(\\sigma/2\\varepsilon_0\\) · \\(\\sigma/\\varepsilon_0\\)'], ['23.3 원판 → 극한', '\\(2\\pi k_e\\sigma[1 - x/\\sqrt{R^2 + x^2}]\\to\\sigma/2\\varepsilon_0\\)']] },
    { h: '24 전위', items: [['전위차', '\\(\\Delta V = -\\int\\vec E\\cdot d\\vec s = -Ed\\) [V = J/C]'], ['점전하', '\\(V = k_eq/r\\), \\(U = k_eq_1q_2/r = qV\\) [J]'], ['미분 관계', '\\(E_x = -dV/dx\\) [V/m]'], ['24.2', '\\(\\tfrac12mv^2 + e\\Delta V = 0\\Rightarrow v = \\sqrt{2eEd/m}\\)']] },
    { h: '25 축전기', items: [['정의 · 평행판', '\\(Q = C\\Delta V\\), \\(C = \\varepsilon_0A/d\\) [F = C/V]'], ['연결', '병렬 합, 직렬 역수 합 (저항과 반대)'], ['에너지', '\\(U = Q^2/2C = \\tfrac12C\\Delta V^2\\) [J], \\(u = \\tfrac12\\varepsilon_0E^2\\) [J/m³]'], ['유전체', '\\(C = \\kappa C_0\\), 장점: 용량↑ · 최대 전압↑ · 기계적 지지'], ['25.18 · 25.8', '\\(F = Q^2/2\\varepsilon_0A\\), \\(C = \\kappa C_0/[f + \\kappa(1 - f)]\\)']] },
    { h: '26 전류·저항', items: [['전류', '\\(I = dQ/dt = nqv_dA\\) [A = C/s]'], ['옴 (물질 → 회로)', '\\(J = \\sigma E\\Rightarrow \\Delta V = IR,\\ R = \\rho\\ell/A\\)'], ['단위', 'R [Ω = V/A], ρ [Ω·m], σ [1/(Ω·m)]'], ['전력', '\\(P = I\\Delta V = I^2R = \\Delta V^2/R\\) [W]']] },
    { h: '27 회로', items: [['키르히호프', '\\(\\sum I = 0\\) (전하 보존), \\(\\sum\\Delta V = 0\\) (에너지 보존)'], ['부호', '저항 전류 방향 −IR, 전지 −→+ 는 +ε'], ['RC', '\\(\\tau = RC\\) [s], 충전 \\(q = C\\varepsilon(1 - e^{-t/RC})\\), 방전 \\(q = Qe^{-t/RC}\\)'], ['63% · ln', 't = τ에서 63% 충전, 비율 문제는 ln (ln 4 = 1.39)']] }
  ];

  /* ---------------- 단위표 ---------------- */
  const UNITS = [
    ['N (뉴턴)', '힘', 'kg·m/s²', '\\(F = ma\\)'],
    ['J (줄)', '에너지·일', 'N·m = kg·m²/s²', '\\(W = F\\Delta x\\)'],
    ['C (쿨롱)', '전하량', 'A·s', '\\(Q = It\\)'],
    ['A (암페어)', '전류', 'C/s', '\\(I = dQ/dt\\)'],
    ['V (볼트)', '전위·전위차', 'J/C', '\\(V = U/q\\)'],
    ['N/C = V/m', '전기장', '(J/C)/m = N/C', '\\(E = F/q,\\ \\Delta V = Ed\\)'],
    ['F (패럿)', '전기용량', 'C/V', '\\(C = Q/\\Delta V\\)'],
    ['Ω (옴)', '저항', 'V/A', '\\(R = \\Delta V/I\\)'],
    ['Ω·m', '비저항', 'Ω·m²/m', '\\(\\rho = RA/\\ell\\)'],
    ['W (와트)', '전력', 'J/s = A·V', '\\(P = I\\Delta V\\)'],
    ['s', '시간 상수', 'Ω·F = C/A', '\\(\\tau = RC\\)'],
    ['eV', '에너지', '1.60×10⁻¹⁹ J', '\\(e\\times1\\ \\mathrm V\\)'],
    ['kWh', '전기요금 에너지', '3.6×10⁶ J', '\\(P\\Delta t\\)']
  ];
  const PREFIX = [['G (기가)', '10⁹'], ['M (메가)', '10⁶'], ['k (킬로)', '10³'], ['c (센티)', '10⁻²'], ['m (밀리)', '10⁻³'], ['μ (마이크로)', '10⁻⁶'], ['n (나노)', '10⁻⁹'], ['p (피코)', '10⁻¹²'], ['Å (옹스트롬)', '10⁻¹⁰ m']];

  /* ======================= 렌더 ======================= */
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let tab = store.get('formula-tab') || 'sum';
  const TABS = [['sum', '시험 직전 요약'], ['units', '단위표'], ['22', '22장'], ['23', '23장'], ['24', '24장'], ['25', '25장'], ['26', '26장'], ['27', '27장']];
  const main = document.getElementById('main');
  const tabsEl = document.getElementById('tabs');
  let allOpen = false;

  function renderTabs() {
    tabsEl.innerHTML = '';
    TABS.forEach(([k, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(k === tab)); b.textContent = label;
      b.addEventListener('click', () => { tab = k; store.set('formula-tab', k); render(); window.scrollTo({ top: 0 }); });
      tabsEl.appendChild(b);
      if (k === tab) setTimeout(() => b.scrollIntoView({ inline: 'center', block: 'nearest' }), 0);
    });
  }

  function card(c) {
    return `<article class="card" tabindex="0">
      <h3>${c.t}${c.star ? '<span class="star">★</span>' : ''}</h3>
      <div class="eq">${c.f}</div>
      <div class="u-line"><span class="u-tag">단위</span><span class="u-val">${c.u}</span></div>
      <div class="u-derive"><span class="lbl">단위가 나오는 과정</span>${c.d}</div>
      ${c.m ? `<p class="mean">${c.m}</p>` : ''}
      ${c.w ? `<p class="when">문제에서: ${c.w}</p>` : ''}
      ${c.p ? `<p class="prof">교수님: ${c.p}</p>` : ''}
      ${c.x ? `<details class="derive"${allOpen ? ' open' : ''}><summary>유도 과정</summary><ol class="steps">${c.x.map(s => `<li>${s}</li>`).join('')}</ol></details>` : ''}
    </article>`;
  }

  function render() {
    renderTabs();
    let h = '';
    if (tab === 'sum') {
      h += `<div class="meta-row"><h2>시험 직전 요약</h2><span class="count">2분 컷</span></div>
        <p class="ch-note">시험장 가는 길에 이것만 본다. 대괄호 안이 단위.</p><div class="list">`;
      SHEET.forEach(s => {
        h += `<section class="sheet"><h3>${s.h}</h3><ul>${s.items.map(i => `<li><span class="k">${i[0]}</span>${i[1]}</li>`).join('')}</ul></section>`;
      });
      h += `</div><p class="tip mt">단위 검산 습관: 답의 단위가 묻는 양과 다르면 식을 잘못 세운 것. 거리는 m, 전하는 C, 용량은 F로 바꿔 넣는다.</p>`;
    } else if (tab === 'units') {
      h += `<div class="meta-row"><h2>단위표와 접두어</h2></div>
        <p class="ch-note">모든 단위 유도는 이 표의 관계를 이어 붙이는 것뿐이다.</p>
        <div class="table-scroll"><table class="utable"><thead><tr><th>단위</th><th>물리량</th><th>기본 단위로</th><th>나오는 식</th></tr></thead><tbody>
        ${UNITS.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="meta-row"><h2>접두어</h2></div>
        <div class="table-scroll"><table class="utable"><thead><tr><th>접두어</th><th>배수</th></tr></thead><tbody>
        ${PREFIX.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="tip mt">교수님: "기가, 메가, 마이크로, 나노 4개 정도는 알아야 한다." 축전기는 μF·nF·pF가 흔하다 (10/1). 1 Å은 원자 하나 크기.</p>`;
    } else {
      const ch = +tab;
      const list = F.filter(c => c.ch === ch);
      const names = { 22: '22장 전기장', 23: '23장 가우스 법칙', 24: '24장 전위', 25: '25장 전기용량과 유전체', 26: '26장 전류와 저항', 27: '27장 직류 회로' };
      h += `<div class="meta-row"><h2>${names[ch]}</h2><span class="count">공식 ${list.length}개</span></div>
        <p class="ch-note">${NOTES[ch]}</p><div class="list">${list.map(card).join('')}</div>`;
    }
    main.innerHTML = h;
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([main]).catch(() => {});
  }

  main.addEventListener('click', e => {
    if (e.target.closest('summary') || e.target.closest('details')) return;
    const c = e.target.closest('.card');
    if (c && document.body.classList.contains('drill')) c.classList.toggle('revealed');
  });
  main.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card') && document.body.classList.contains('drill')) {
      e.preventDefault(); e.target.classList.toggle('revealed');
    }
  });
  const drill = document.getElementById('drill');
  drill.addEventListener('click', () => {
    const on = !document.body.classList.contains('drill');
    document.body.classList.toggle('drill', on);
    drill.setAttribute('aria-pressed', String(on));
    drill.textContent = on ? '가리는 중' : '식 가리고 외우기';
    main.querySelectorAll('.card').forEach(c => c.classList.remove('revealed'));
  });
  const openAll = document.getElementById('openAll');
  openAll.addEventListener('click', () => {
    allOpen = !allOpen;
    openAll.setAttribute('aria-pressed', String(allOpen));
    openAll.textContent = allOpen ? '유도 접기' : '유도 전부 펼치기';
    main.querySelectorAll('details.derive').forEach(d => { d.open = allOpen; });
  });

  render();
})();
</script>
