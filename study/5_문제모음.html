      trap: '평행판 두 장 사이는 σ/ε₀(2배)다. 슬라이드에 σ/2ε₀로 잘못 적힌 곳이 있으니 헷갈리지 말 것. 가우스면 그림을 꼭 그려서 어디를 셌는지 보여 준다.' },

    /* ---------------- 24 ---------------- */
    { ch: 24, id: 'p247', tag: '연습 24장 7(8)', title: '두 점전하 중점의 전위와 위치 에너지', hot: true,
      why: '교재 필기. 10/15 수업 화면에 풀이가 나왔다.',
      text: '전하량이 각각 \\(Q_1 = +5.00\\ \\mathrm{nC}\\), \\(Q_2 = -3.00\\ \\mathrm{nC}\\)인 두 점전하가 서로 35.0 cm 떨어져 있다. (a) 두 점전하 사이의 중간에서 전위를 계산하라. (b) 이 전하 쌍의 위치 에너지를 계산하라. 이 결괏값의 부호는 어떤 의미가 있는가?',
      defs: ['전위: 그 위치에서의 단위 전하당 전기적 위치 에너지. 점전하는 \\(V = k_eq/r\\)(무한대에서 0), 여러 개는 스칼라 합.', '전기적 위치 에너지: 두 점전하 계는 \\(U = k_eq_1q_2/r_{12}\\).'],
      steps: [
        '단위 변환: nC → 10⁻⁹ C, 중점까지 거리 \\(r = 0.175\\ \\mathrm m\\), 두 전하 사이 \\(r_{12} = 0.350\\ \\mathrm m\\)',
        '(a) 전위는 스칼라라 부호를 넣어 그냥 더한다: \\(V = k_e\\left(\\dfrac{5.00\\times10^{-9}}{0.175} + \\dfrac{-3.00\\times10^{-9}}{0.175}\\right)\\)',
        '\\(V = (8.99\\times10^9)\\dfrac{2.00\\times10^{-9}}{0.175} = 103\\ \\mathrm V\\)',
        '(b) \\(U = k_e\\dfrac{q_1q_2}{r_{12}} = (8.99\\times10^9)\\dfrac{(5.00\\times10^{-9})(-3.00\\times10^{-9})}{0.350}\\)',
        '\\(U = -3.85\\times10^{-7}\\ \\mathrm J\\)',
        '부호의 의미: U < 0 → 두 전하는 인력으로 구속되어 있다. 둘을 무한히 떼어 놓으려면 외부에서 \\(3.85\\times10^{-7}\\ \\mathrm J\\)의 양의 일을 해 줘야 한다.'
      ],
      answer: '(a) 103 V · (b) \\(-3.85\\times10^{-7}\\ \\mathrm J\\), 음수 = 인력으로 구속(떼려면 양의 일 필요)',
      check: 'V: \\(\\dfrac{\\mathrm{N\\,m^2}}{\\mathrm{C^2}}\\cdot\\dfrac{\\mathrm C}{\\mathrm m} = \\dfrac{\\mathrm{N\\,m}}{\\mathrm C} = \\mathrm{J/C} = \\mathrm V\\) · U: \\(\\dfrac{\\mathrm{N\\,m^2}}{\\mathrm{C^2}}\\cdot\\dfrac{\\mathrm{C^2}}{\\mathrm m} = \\mathrm J\\)',
      trap: '전위는 부호를 넣어 더하고(스칼라), 힘처럼 절댓값 쓰고 방향 따로 붙이지 않는다. (a)는 중점까지 거리 0.175 m, (b)는 전체 거리 0.350 m.' },
    { ch: 24, id: 'p2418', tag: '연습 24장 18(24)', title: 'V–x 그래프에서 E_x–x 그래프 그리기', hot: true, fig: 'p2418',
      why: '교재 필기. 24장은 "전위와 전기장은 미분 관계"를 계속 강조했다(9/22, 10/15 칠판 gradient).',
      text: '어떤 영역의 전기장은 x축과 평행하다. 전위가 그림 P24.18과 같이 위치에 따라 변한다. 이 영역에서 전기장의 x 성분과 위치의 관계를 나타내는 그래프를 그리라.',
      defs: ['전위와 전기장의 관계: 전기장은 전위를 위치로 미분한 기울기에 마이너스를 붙인 것. \\(E_x = -\\dfrac{dV}{dx}\\)'],
      steps: [
        '그래프가 직선 구간이라 구간마다 기울기가 일정 → \\(E_x\\)도 구간마다 상수(계단 모양). 1 cm = 0.01 m.',
        '0~1 cm: V 0 → 30 V, 기울기 \\(\\dfrac{30}{0.01} = +3000\\ \\mathrm{V/m}\\) → \\(E_x = -3000\\ \\mathrm{V/m}\\)',
        '1~2 cm: 30 → 0 V, 기울기 −3000 → \\(E_x = +3000\\ \\mathrm{V/m}\\)',
        '2~3 cm: 0 → 0 V, 기울기 0 → \\(E_x = 0\\)',
        '3~4 cm: 0 → −30 V, 기울기 −3000 → \\(E_x = +3000\\ \\mathrm{V/m}\\)',
        '4~5 cm: −30 → 0 V, 기울기 +3000 → \\(E_x = -3000\\ \\mathrm{V/m}\\)'
      ],
      answer: '\\(E_x\\) = −3000, +3000, 0, +3000, −3000 V/m (각 1 cm 구간). 수평선 계단 그래프 (그림 아래쪽)',
      check: '\\(\\dfrac{\\mathrm V}{\\mathrm m} = \\dfrac{\\mathrm N}{\\mathrm C}\\)',
      trap: '마이너스를 빼먹으면 그래프가 통째로 뒤집힌다. cm 그대로 쓰면 30 V/cm로 단위가 틀린다. 바로 위 17(22)도 같은 방법: −2000, 0, +2000 V/m.' },
    { ch: 24, id: 'p242', tag: '예제 24.2', title: '균일한 전기장 속 양성자의 속력 (에너지 보존)', hot: true, fig: 'p242',
      why: '9/22: "이 노란 거까지만 계산하면 돼. 숫자 안 나와. 낼 거야, 내가 낼 거예요." 22.5(B)와 비교하는 문제로 나올 수 있다.',
      text: '\\(8.0\\times10^4\\ \\mathrm{V/m}\\)의 균일한 전기장 내에서 양성자를 정지 상태로부터 놓았다. 양성자가 점 A에서 B까지 E의 방향으로 d = 0.50 m만큼 이동한다. 이동한 후의 속력을 구하라.',
      defs: ['전위차: 두 점 사이 단위 전하당 위치 에너지의 변화. 균일한 전기장에서 \\(\\Delta V = -Ed\\).', '고립계(전하-전기장계)에서는 역학적 에너지가 보존된다: \\(\\Delta K + \\Delta U = 0\\).'],
      steps: [
        '전기장(보존력)이 있는 고립계 → 역학적 에너지 보존: \\(\\Delta K + \\Delta U = 0\\)',
        '위치 에너지 변화: \\(\\Delta U = e\\Delta V\\), 전기장 방향으로 이동했으므로 \\(\\Delta V = -Ed\\)',
        '\\(\\left(\\tfrac12mv^2 - 0\\right) + e\\Delta V = 0\\)',
        '\\(v = \\sqrt{\\dfrac{-2e\\Delta V}{m}} = \\sqrt{\\dfrac{-2e(-Ed)}{m}} = \\sqrt{\\dfrac{2eEd}{m}}\\)',
        '(숫자를 물으면) \\(v = \\sqrt{\\dfrac{2(1.60\\times10^{-19})(8.0\\times10^4)(0.50)}{1.67\\times10^{-27}}} = 2.8\\times10^6\\ \\mathrm{m/s}\\)'
      ],
      answer: '\\(v = \\sqrt{2eEd/m}\\) (≈ 2.8×10⁶ m/s). 22.5(B) 비고립계 결과와 같다.',
      check: '\\(\\sqrt{\\mathrm{C\\cdot(V/m)\\cdot m/kg}} = \\sqrt{\\mathrm{C\\,V/kg}} = \\sqrt{\\mathrm{J/kg}} = \\mathrm{m/s}\\)',
      trap: 'ΔV = −Ed의 마이너스와 근호 안의 마이너스가 만나 양수가 된다. 일부러 양성자로 낸 이유: 전자면 전하 부호까지 바뀌어 헷갈린다(9/22).' },

    /* ---------------- 25 ---------------- */
    { ch: 25, id: 'p2518', tag: '연습 25장 18(22)', title: '평행판 축전기 판 사이의 힘', hot: true, fig: 'p2518',
      why: '교재 필기. 10/15 수업에서 풀어 줬다: "2분의 1이 있느냐 없느냐의 차이, 연속적으로 전하가 채워지는 상태를 한쪽으로 모아진 것처럼 계산하면 안 된다."',
      text: '전하량 Q, 넓이 A인 판으로 이루어진 평행판 축전기가 있다. 판 사이 전기장이 \\(E = Q/A\\varepsilon_0\\)이므로 힘이 \\(F = QE = Q^2/A\\varepsilon_0\\)이라고 생각할 수도 있으나 이 결론은 옳지 않다. 각 판에 작용하는 힘은 실제로 \\(F = Q^2/2A\\varepsilon_0\\)임을 보이라. (도움말: 판 사이 임의의 거리 x에 대하여 \\(C = \\varepsilon_0A/x\\)이고, 두 판을 떼어 놓는 데 필요한 일은 \\(W = \\int F\\,dx\\)이다.)',
      defs: ['전기용량: \\(C = Q/\\Delta V\\), 평행판 \\(C = \\varepsilon_0A/x\\).', '축전기에 저장된 에너지: 충전할 때 외부가 한 일이 전기장의 형태로 저장된다. \\(U = Q^2/2C\\).'],
      steps: [
        'F = QE가 틀린 이유: 판 사이 E는 두 판이 함께 만든 것이다. 한 판이 만든 전기장은 그 판 자신에게 힘을 줄 수 없으므로, 상대 판의 전기장 \\(E/2 = Q/2A\\varepsilon_0\\)만 작용한다.',
        '판 간격이 x일 때 \\(C = \\dfrac{\\varepsilon_0A}{x}\\), 저장 에너지 \\(U = \\dfrac{Q^2}{2C} = \\dfrac{Q^2x}{2\\varepsilon_0A}\\)',
        '두 판을 떼어 놓는 데 필요한 일 = 저장된 에너지: \\(U = \\int F\\,dx\\)',
        '\\(F = \\dfrac{dU}{dx} = \\dfrac{d}{dx}\\left(\\dfrac{Q^2}{2C}\\right) = \\dfrac12\\dfrac{d}{dx}\\left(\\dfrac{Q^2x}{\\varepsilon_0A}\\right) = \\dfrac{Q^2}{2\\varepsilon_0A}\\)',
        '확인: \\(F = Q\\cdot\\dfrac{E}{2} = Q\\cdot\\dfrac{Q}{2A\\varepsilon_0}\\) — 같은 결과.'
      ],
      answer: '\\(F = \\dfrac{Q^2}{2\\varepsilon_0A}\\) — 한 판의 전기장은 자기 자신에게 힘을 주지 않으므로 ½이 붙는다.',
      check: '\\(\\dfrac{\\mathrm{C^2}}{\\mathrm{C^2/(N\\,m^2)}\\cdot\\mathrm{m^2}} = \\mathrm N\\)',
      trap: '"왜 F = QE가 틀린가"를 문장으로 쓰는 게 이 문제의 절반이다. 운동 에너지 ½mv²의 ½과 같은 이유(적분)로 설명할 수 있다.' },
    { ch: 25, id: 'p258', tag: '예제 25.8', title: '유전체로 일부만 채운 축전기', hot: true, fig: 'p258',
      why: '교재 필기. 10/1: "f에 숫자를 넣어서 연습하라. 이것만큼은 2분의 1이든 3분의 1이든 숫자로 줄 것 같다." "별 두 개, 물망에 오를 수 있다."',
      text: '평행판 축전기에서 두 도체판은 d만큼 떨어져 있고, 유전체가 없을 때의 전기용량은 \\(C_0\\)이다. 두 판 사이에 두께가 fd이고 유전 상수가 κ인 유전체를 넣었을 때 축전기의 전기용량은 얼마인가? (0 < f < 1)',
      defs: ['전기용량: \\(C = Q/\\Delta V\\), 평행판 \\(C_0 = \\varepsilon_0A/d\\).', '유전체: 비전도성 물질. 판 사이에 넣으면 전기용량이 κ배로 증가한다.', '직렬 연결: 전하량이 같고 \\(1/C = 1/C_1 + 1/C_2\\).'],
      steps: [
        '유전체가 차지한 부분과 빈 부분을 두 축전기의 직렬 연결로 본다(경계면을 얇은 도체판이라 생각). 유전체를 어느 판에 붙여도 결과는 같다.',
        '\\(C_1 = \\dfrac{\\kappa\\varepsilon_0A}{fd},\\qquad C_2 = \\dfrac{\\varepsilon_0A}{(1 - f)d}\\)',
        '\\(\\dfrac1C = \\dfrac{fd}{\\kappa\\varepsilon_0A} + \\dfrac{(1 - f)d}{\\varepsilon_0A} = \\dfrac{fd}{\\kappa\\varepsilon_0A} + \\dfrac{\\kappa(1 - f)d}{\\kappa\\varepsilon_0A} = \\dfrac{f + \\kappa(1 - f)}{\\kappa}\\cdot\\dfrac{d}{\\varepsilon_0A}\\)',
        '뒤집으면 \\(C = \\dfrac{\\kappa}{f + \\kappa(1 - f)}\\cdot\\dfrac{\\varepsilon_0A}{d} = \\dfrac{\\kappa}{f + \\kappa(1 - f)}C_0\\)',
        '확인: f = 0이면 \\(C = C_0\\), f = 1이면 \\(C = \\kappa C_0\\) ✓',
        '숫자 연습 f = 1/2: \\(C = \\dfrac{\\kappa}{\\frac12 + \\frac{\\kappa}{2}}C_0 = \\dfrac{2\\kappa}{1 + \\kappa}C_0\\). f = 1/3: \\(C = \\dfrac{3\\kappa}{1 + 2\\kappa}C_0\\)'
      ],
      answer: '\\(C = \\dfrac{\\kappa}{f + \\kappa(1 - f)}C_0\\)',
      check: '분수는 단위 없음(κ, f 모두 무차원) × \\(C_0\\)[F] = F',
      trap: '직렬인지 병렬인지가 핵심. 판과 평행하게 층으로 넣으면 직렬, 판 넓이를 나눠 옆으로 넣으면 병렬이다.' },

    /* ---------------- 26 ---------------- */
    { ch: 26, id: 'p26ohm', tag: '26장 (교재 필기)', title: '물질의 옴 법칙 J = σE에서 회로의 옴 법칙 유도', hot: true, fig: 'p26',
      why: '교재 필기 "26장 J = σE 옴의 법칙(물질 → 회로 유도)". 10/15: "26장에서 별도로 낼 수 있는 문제는 없고 엮이게 된다. j = σE가 물질의 옴의 법칙."',
      text: '(예상 문제) 전류 밀도와 전기장의 관계 \\(J = \\sigma E\\)로부터 길이 ℓ, 단면적 A인 균일한 도선에 대해 \\(\\Delta V = IR\\)을 유도하고, 저항 R을 비저항 ρ로 나타내라. 전기 전도도와 비저항을 정의하라.',
      defs: ['전기 전도도 σ: 전류 밀도가 전기장에 비례할 때(J = σE)의 비례 상수. 전기가 잘 통하는 정도를 수치화한 값. 단위 1/(Ω·m).', '비저항 ρ: 전류의 흐름을 방해하는 정도를 수치화한 값으로 전도도의 역수(ρ = 1/σ). 물질마다 고유한 값이다. 단위 Ω·m.', '저항: \\(R \\equiv \\Delta V/I\\), 단위 Ω = V/A.'],
      steps: [
        '균일한 도선의 양 끝 전위차: \\(\\Delta V = E\\ell\\)',
        '물질의 옴 법칙 \\(J = \\sigma E\\)에서 \\(E = J/\\sigma\\): \\(\\Delta V = \\dfrac{\\ell}{\\sigma}J\\)',
        '전류 밀도의 정의 \\(J = I/A\\)를 대입: \\(\\Delta V = \\left(\\dfrac{\\ell}{\\sigma A}\\right)I\\)',
        '괄호 안을 저항 R로 정의하면 회로의 옴 법칙: \\(\\Delta V = RI\\), \\(R \\equiv \\dfrac{\\Delta V}{I} = \\dfrac{\\ell}{\\sigma A}\\)',
        '\\(\\rho = 1/\\sigma\\)이므로 \\(R = \\rho\\dfrac{\\ell}{A}\\)',
        '해석: 단면적이 크면 통로가 넓어 R 감소, 길이가 길면 충돌이 많아 R 증가.'
      ],
      answer: '\\(\\Delta V = \\left(\\dfrac{\\ell}{\\sigma A}\\right)I = RI,\\quad R = \\rho\\dfrac{\\ell}{A}\\)',
      check: '\\(\\Omega\\cdot\\mathrm m\\cdot\\dfrac{\\mathrm m}{\\mathrm m^2} = \\Omega\\); \\(\\sigma = \\dfrac{J}{E}:\\ \\dfrac{\\mathrm{A/m^2}}{\\mathrm{V/m}} = \\dfrac{1}{\\Omega\\,\\mathrm m}\\)',
      trap: '같은 필기 줄에 "전위와 전위차의 차이"도 적혀 있다. 전위는 어느 한 위치에서의 단위 전하당 에너지, 전위차는 두 위치 사이 그 값의 차이. 이것도 문장으로 써 둘 것.' },
    { ch: 26, id: 'p26box', tag: '26장 (10/6 수업)', title: '직육면체 저항체: 방향에 따라 달라지는 저항',
      why: '10/6: "이거 문제를 노출하는 거 같아서… 그래도 설명을 하자." 하나의 육면체를 놓고 어느 면으로 전류를 흘리느냐에 따라 저항을 구하는 문제.',
      text: '(예상 문제) 비저항이 ρ이고 가로 a, 세로 b, 길이 c인 직육면체 저항체가 있다. 전류를 (1) 길이 c 방향으로 흘릴 때와 (2) 가로 a 방향으로 흘릴 때의 저항을 각각 구하라.',
      defs: ['비저항: 전류의 흐름을 방해하는 정도를 수치화한 물질 고유의 값. \\(R = \\rho\\ell/A\\).'],
      steps: [
        '\\(R = \\rho\\dfrac{\\ell}{A}\\)에서 ℓ은 전류가 흐르는 방향의 길이, A는 그 방향에 수직인 단면적.',
        '(1) c 방향: \\(\\ell = c\\), \\(A = ab\\) → \\(R_1 = \\rho\\dfrac{c}{ab}\\)',
        '(2) a 방향: \\(\\ell = a\\), \\(A = bc\\) → \\(R_2 = \\rho\\dfrac{a}{bc}\\)',
        '같은 물질(같은 ρ)이어도 흘리는 방향에 따라 저항이 다르다. 비저항은 물질 고유, 저항은 모양에 의존.'
      ],
      answer: '\\(R_1 = \\rho c/(ab)\\), \\(R_2 = \\rho a/(bc)\\)',
      check: '\\(\\Omega\\,\\mathrm m\\cdot\\dfrac{\\mathrm m}{\\mathrm m^2} = \\Omega\\)',
      trap: '교수님: "이렇게 가면 이게 뭐지? 하고 못 푸는데, 알면 그냥 쏙 집어넣으면 되는 거다." 길이와 단면적을 헷갈리지 말 것.' },

    /* ---------------- 27 ---------------- */
    { ch: 27, id: 'p2720', tag: '연습 27장 20(22)', title: '키르히호프 법칙으로 세 전류 구하기', hot: true, fig: 'p2720',
      why: '교재 필기. 10/15: "이 문제가 나오는 건 아닐 확률이 크지만 키르히호프가 적용되는 연습을 해라. 여기서 가르쳐주는 대로 하란 말이에요. 왜 지가 고쳐?"',

      text: '두 개의 \\(2.00\\ \\mu\\mathrm C\\) 점전하가 x축의 x = 1.00 m와 x = −1.00 m에 있다. (a) y축의 y = 0.500 m에서의 전기장을 구하라. (b) 그 점에 놓인 전하량 \\(-3.00\\ \\mu\\mathrm C\\)에 작용하는 전기력을 계산하라.',
      defs: ['전기장: 그 점에 놓인 시험 전하가 받는 단위 전하당 힘. 점전하는 \\(E = k_eq/r^2\\).', '전기장 안의 전하가 받는 힘: \\(\\vec F = q\\vec E\\) (q가 음수면 반대 방향).'],
      steps: [
        '각 전하까지 거리: \\(r = \\sqrt{1.00^2 + 0.500^2} = 1.118\\ \\mathrm m\\), \\(r^2 = 1.25\\ \\mathrm{m^2}\\)',
        '각 전기장 크기: \\(E_1 = E_2 = k_e\\dfrac{2.00\\times10^{-6}}{1.25} = 1.44\\times10^4\\ \\mathrm{N/C}\\)',
        '대칭: x성분은 크기가 같고 방향이 반대라 상쇄, y성분만 더한다. \\(\\sin\\theta = \\dfrac{0.500}{1.118} = 0.447\\)',
        '(a) \\(E_y = 2(1.44\\times10^4)(0.447) = 1.29\\times10^4\\ \\mathrm{N/C}\\) (+y 방향)',
        '(b) \\(\\vec F = q\\vec E = (-3.00\\times10^{-6})(1.29\\times10^4\\,\\hat j) = -3.86\\times10^{-2}\\,\\hat j\\ \\mathrm N\\)'
      ],
      answer: '(a) \\(1.29\\times10^4\\,\\hat j\\ \\mathrm{N/C}\\) · (b) \\(-3.86\\times10^{-2}\\,\\hat j\\ \\mathrm N\\) (−y 방향, 크기 0.0386 N)',
      check: '\\(E:\\ \\dfrac{\\mathrm{N\\,m^2}}{\\mathrm{C^2}}\\cdot\\dfrac{\\mathrm C}{\\mathrm{m^2}} = \\mathrm{N/C}\\); \\(F:\\ \\mathrm C\\cdot\\mathrm{N/C} = \\mathrm N\\)',
      trap: '전기장은 시험 전하(+1 C) 기준으로 먼저 구하고, 그다음에 실제 전하 −3.00 μC를 곱한다. 음전하라 힘은 E와 반대.' },
    { ch: 22, id: 'e2224', tag: '연습 22장 24(24)', title: '균일한 전기장에서 정지 상태로부터 가속되는 양성자',
      why: '연결: 예제 22.5. 가속도(힘) → 시간·거리(등가속도) → 운동 에너지(W = ΔK)를 한 문제에서 모두 쓴다.',
      text: '640 N/C의 균일한 전기장 내에서 양성자가 정지 상태로부터 가속된다. 잠시 후 양성자의 속력은 1.20 Mm/s가 되었다(비상대론적). (a) 양성자의 가속도 (b) 이 속력에 도달하는 데 걸리는 시간 (c) 그동안 이동한 거리 (d) 이 시간 끝에서의 운동 에너지를 구하라.',
      defs: ['전기장 속 전하: \\(F = qE = ma\\), 균일하면 등가속도 운동.', '일-에너지 정리: \\(W = \\Delta K\\).'],
      steps: [
        '(a) \\(a = \\dfrac{eE}{m_p} = \\dfrac{(1.60\\times10^{-19})(640)}{1.67\\times10^{-27}} = 6.13\\times10^{10}\\ \\mathrm{m/s^2}\\)',
        '(b) \\(v = 0 + at\\Rightarrow t = \\dfrac{v}{a} = \\dfrac{1.20\\times10^6}{6.13\\times10^{10}} = 1.96\\times10^{-5}\\ \\mathrm s\\)',
        '(c) \\(v^2 = 2ax\\Rightarrow x = \\dfrac{v^2}{2a} = \\dfrac{(1.20\\times10^6)^2}{2(6.13\\times10^{10})} = 11.7\\ \\mathrm m\\)',
        '(d) \\(K = \\tfrac12m_pv^2 = \\tfrac12(1.67\\times10^{-27})(1.20\\times10^6)^2 = 1.20\\times10^{-15}\\ \\mathrm J\\)',
        '검산(W = ΔK): \\(eEx = (1.60\\times10^{-19})(640)(11.7) = 1.20\\times10^{-15}\\ \\mathrm J\\) ✓'
      ],
      answer: '(a) \\(6.13\\times10^{10}\\ \\mathrm{m/s^2}\\) · (b) \\(1.96\\times10^{-5}\\ \\mathrm s\\) · (c) 11.7 m · (d) \\(1.20\\times10^{-15}\\ \\mathrm J\\)',
      check: '\\(a:\\ \\mathrm{C\\cdot(N/C)/kg = m/s^2}\\); \\(t:\\ \\dfrac{\\mathrm{m/s}}{\\mathrm{m/s^2}} = \\mathrm s\\); \\(K:\\ \\mathrm{kg\\,(m/s)^2 = J}\\)',
      trap: 'Mm/s = 10⁶ m/s. 양성자 질량 1.67×10⁻²⁷ kg(전자 9.11×10⁻³¹ kg와 헷갈리지 말 것).' },
    { ch: 22, id: 'e2225', tag: '연습 22장 25(25)', title: '수평으로 들어온 양성자의 포물선 운동',
      why: '교재 사진에 동그라미 친 문제. 연결: 예제 22.6(전자의 포물선 운동). x는 등속, y는 등가속.',
      text: '양성자가 \\(4.50\\times10^5\\ \\mathrm{m/s}\\)로 수평 방향으로 이동하여 균일한 연직 전기장 \\(9.60\\times10^3\\ \\mathrm{N/C}\\) 안으로 들어간다. 중력은 무시한다. (a) 수평으로 5.00 cm 이동하는 데 걸린 시간 (b) 그동안의 연직 변위 (c) 그 순간 속도의 수평 성분과 연직 성분을 구하라.',
      defs: ['균일한 전기장 속 전하는 \\(a = qE/m\\)의 일정한 가속도를 받는다. 전기장에 수직인 방향은 힘이 없어 등속 운동.'],
      steps: [
        '(a) x방향 등속: \\(t = \\dfrac{\\Delta x}{v_x} = \\dfrac{0.0500}{4.50\\times10^5} = 1.11\\times10^{-7}\\ \\mathrm s\\)',
        'y방향 가속도: \\(a_y = \\dfrac{eE}{m_p} = \\dfrac{(1.60\\times10^{-19})(9.60\\times10^3)}{1.67\\times10^{-27}} = 9.20\\times10^{11}\\ \\mathrm{m/s^2}\\)',
        '(b) \\(\\Delta y = \\tfrac12a_yt^2 = \\tfrac12(9.20\\times10^{11})(1.11\\times10^{-7})^2 = 5.68\\times10^{-3}\\ \\mathrm m = 5.68\\ \\mathrm{mm}\\)',
        '(c) \\(v_x = 4.50\\times10^5\\ \\mathrm{m/s}\\) (변하지 않음), \\(v_y = a_yt = (9.20\\times10^{11})(1.11\\times10^{-7}) = 1.02\\times10^5\\ \\mathrm{m/s}\\)'
      ],
      answer: '(a) \\(1.11\\times10^{-7}\\ \\mathrm s\\) · (b) 5.68 mm (전기장 방향) · (c) \\(v_x = 4.50\\times10^5\\), \\(v_y = 1.02\\times10^5\\ \\mathrm{m/s}\\)',
      check: '\\((\\mathrm{m/s^2})\\cdot\\mathrm s^2 = \\mathrm m\\), \\((\\mathrm{m/s^2})\\cdot\\mathrm s = \\mathrm{m/s}\\)',
      trap: '수평 성분은 처음 속력 그대로다. 5.00 cm → 0.0500 m.' },

    /* ---------------- 23 ---------------- */
    { ch: 23, id: 'e2312', tag: '연습 23장 12(16)', title: '정육면체 중심의 전하: 면 하나와 전체의 선속',
      why: '연결: 연습 11(15). "가우스면 모양과 상관없이 안의 전하만"을 숫자로 확인하는 문제.',
      text: '한 변의 길이가 80.0 cm인 정육면체의 중심에 170 μC인 전하가 있다. 근처에 다른 전하가 없을 때 (a) 각 면을 통과하는 전기선속 (b) 전체 면을 통과하는 전기선속을 구하라. (c) 전하가 중심에 있지 않으면 (a)나 (b)의 답이 달라지는가?',
      defs: ['가우스 법칙: 닫힌 곡면을 지나는 알짜 전기선속 = 내부 알짜 전하 / ε₀. 곡면의 모양·크기와 무관.'],
      steps: [
        '(b) 전체: \\(\\Phi = \\dfrac{q}{\\varepsilon_0} = \\dfrac{170\\times10^{-6}}{8.85\\times10^{-12}} = 1.92\\times10^7\\ \\mathrm{N\\,m^2/C}\\)',
        '(a) 중심에 있으면 여섯 면이 대칭 → 똑같이 나눈다: \\(\\Phi_{\\text{면}} = \\dfrac{1.92\\times10^7}{6} = 3.20\\times10^6\\ \\mathrm{N\\,m^2/C}\\)',
        '(c) 전체 선속(b)은 안에 든 전하만으로 정해지므로 그대로다. 면마다의 선속(a)은 대칭이 깨지므로 달라진다.',
        '한 변 80.0 cm는 답에 쓰이지 않는다 — 가우스 법칙은 크기와 무관.'
      ],
      answer: '(a) \\(3.20\\times10^6\\ \\mathrm{N\\,m^2/C}\\) · (b) \\(1.92\\times10^7\\ \\mathrm{N\\,m^2/C}\\) · (c) (a)는 달라지고 (b)는 같다',
      check: '\\(\\dfrac{\\mathrm C}{\\mathrm{C^2/(N\\,m^2)}} = \\mathrm{N\\,m^2/C}\\)',
      trap: '주어진 길이를 꼭 써야 한다고 생각하면 함정에 빠진다.' },
    { ch: 23, id: 'e2320', tag: '연습 23장 20(27)', title: '무한 평면 바로 위의 전기장',
      why: '연결: 예제 23.7을 숫자로. σ/2ε₀ 공식과 가우스면(양쪽 뚜껑)을 그대로 쓴다.',
      text: '단위 넓이당 전하가 \\(9.00\\ \\mu\\mathrm C/\\mathrm m^2\\)로 대전된 무한 평면이 수평으로 있을 때, 이 평면의 중앙 바로 위에서의 전기장을 구하라.',
      defs: ['가우스 법칙: \\(\\oint\\vec E\\cdot d\\vec A = q_{\\text{in}}/\\varepsilon_0\\).', '면 전하 밀도 σ: 단위 넓이당 전하량.'],
      steps: [
        '평면을 꿰뚫는 원통 가우스면, 양쪽 뚜껑(넓이 A)만 선속이 있다: \\(2EA = \\dfrac{\\sigma A}{\\varepsilon_0}\\)',
        '\\(E = \\dfrac{\\sigma}{2\\varepsilon_0} = \\dfrac{9.00\\times10^{-6}}{2(8.85\\times10^{-12})} = 5.08\\times10^5\\ \\mathrm{N/C}\\)',
        '방향: 양전하이므로 평면에서 멀어지는 쪽(위)'
      ],
      answer: '\\(5.08\\times10^5\\ \\mathrm{N/C}\\), 위쪽(평면에서 멀어지는 방향). 높이와 무관.',
      check: '\\(\\dfrac{\\mathrm{C/m^2}}{\\mathrm{C^2/(N\\,m^2)}} = \\mathrm{N/C}\\)',
      trap: '판 한 장은 σ/2ε₀, 평행판 사이는 σ/ε₀.' },
    { ch: 23, id: 'e2326', tag: '연습 23장 26(33)', title: '속이 찬 균일 대전 구: 안과 밖의 전기장',
      why: '연결: 예제 23.5(구 대칭). 9/15 수업에서 "내부는 직선, 외부는 1/r², 경계는 첨점"이라고 그래프까지 설명한 유형.',
      text: '반지름이 40.0 cm인 속이 찬 구 내부에 전체 양전하 26.0 μC가 균일하게 분포되어 있다. 구의 중심으로부터 (a) 0 cm (b) 10.0 cm (c) 40.0 cm (d) 60.0 cm 떨어진 곳에서 전기장의 크기를 구하라.',
      defs: ['가우스 법칙: 동심 구 가우스면에서 \\(E\\cdot4\\pi r^2 = q_{\\text{in}}/\\varepsilon_0\\).', '내부(r < a): \\(q_{\\text{in}} = Q(r^3/a^3)\\) → \\(E = k_eQr/a^3\\). 외부(r ≥ a): \\(E = k_eQ/r^2\\).'],
      steps: [
        '\\(k_eQ = (8.99\\times10^9)(26.0\\times10^{-6}) = 2.34\\times10^5\\ \\mathrm{N\\,m^2/C}\\), \\(a = 0.400\\ \\mathrm m\\)',
        '(a) r = 0: 가우스면 안 전하 0 → \\(E = 0\\)',
        '(b) r = 0.100 m (내부): \\(E = \\dfrac{k_eQr}{a^3} = \\dfrac{(2.34\\times10^5)(0.100)}{(0.400)^3} = 3.65\\times10^5\\ \\mathrm{N/C}\\)',
        '(c) r = 0.400 m (표면): \\(E = \\dfrac{k_eQ}{a^2} = \\dfrac{2.34\\times10^5}{0.160} = 1.46\\times10^6\\ \\mathrm{N/C}\\) (최대)',
        '(d) r = 0.600 m (외부): \\(E = \\dfrac{2.34\\times10^5}{0.360} = 6.49\\times10^5\\ \\mathrm{N/C}\\)'
      ],
      answer: '(a) 0 · (b) \\(3.65\\times10^5\\) · (c) \\(1.46\\times10^6\\) · (d) \\(6.49\\times10^5\\ \\mathrm{N/C}\\)',
      check: '내부식: \\(\\dfrac{\\mathrm{N\\,m^2}}{\\mathrm{C^2}}\\cdot\\mathrm C\\cdot\\dfrac{\\mathrm m}{\\mathrm{m^3}} = \\mathrm{N/C}\\)',
      trap: '내부에서 전체 Q를 그대로 쓰면 틀린다. 가우스면 안에 든 만큼만(부피 비율 r³/a³).' },
    { ch: 23, id: 'e2322', tag: '연습 23장 22(29)', title: '긴 직선 필라멘트를 감싼 원통: 전기장과 선속',
      why: '연결: 예제 23.6(원통 대칭)과 연습 11(15)(선속 = q_in/ε₀). 두 결과를 함께 쓴다.',
      text: '길이가 7.00 m인 직선 필라멘트에 전체 양전하 2.00 μC가 균일하게 분포되어 있다. 길이가 2.00 cm이고 반지름이 10.0 cm인 대전되지 않은 마분지 원통이 필라멘트를 중심축으로 하면서 감싸고 있다. 합리적인 근사를 이용하여 (a) 원통 표면에서의 전기장과 (b) 원통에서 나오는 알짜 전기선속을 구하라.',
      defs: ['선 전하 밀도 λ = Q/ℓ.', '무한 직선의 전기장(원통 가우스면, 옆면만): \\(E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0r}\\).'],
      steps: [
        '근사: 필라멘트(7.00 m)가 원통(2.00 cm)보다 훨씬 길다 → 무한 직선으로 본다.',
        '\\(\\lambda = \\dfrac{2.00\\times10^{-6}}{7.00} = 2.86\\times10^{-7}\\ \\mathrm{C/m}\\)',
        '(a) \\(E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0r} = \\dfrac{2.86\\times10^{-7}}{2\\pi(8.85\\times10^{-12})(0.100)} = 5.14\\times10^4\\ \\mathrm{N/C}\\) (바깥 방향)',
        '(b) 원통 안의 전하 \\(q_{\\text{in}} = \\lambda(0.0200) = 5.71\\times10^{-9}\\ \\mathrm C\\) → \\(\\Phi = \\dfrac{q_{\\text{in}}}{\\varepsilon_0} = 646\\ \\mathrm{N\\,m^2/C}\\)',
        '검산: \\(\\Phi = E(2\\pi rL) = (5.14\\times10^4)(2\\pi)(0.100)(0.0200) = 646\\) ✓'
      ],
      answer: '(a) \\(5.14\\times10^4\\ \\mathrm{N/C}\\) · (b) \\(646\\ \\mathrm{N\\,m^2/C}\\)',
      check: '\\(\\dfrac{\\mathrm{C/m}}{\\mathrm{C^2/(N\\,m^2)}\\cdot\\mathrm m} = \\mathrm{N/C}\\)',
      trap: '선속에는 원통 길이(2.00 cm) 안의 전하만 넣는다. 전체 2.00 μC를 넣으면 틀린다.' },

    /* ---------------- 24 ---------------- */
    { ch: 24, id: 'e243', tag: '연습 24장 3(3)', title: '평행판 사이의 전기장, 힘, 일',
      why: '연결: 예제 24.1·24.2. ΔV = Ed와 W = Fd를 같이 쓰는 기본형.',
      text: '서로 다른 부호로 대전된 평행한 판 두 개가 5.33 mm 떨어져 있다. 판 사이의 전위차는 600 V이다. (a) 판 사이의 전기장의 크기 (b) 판 사이에 전자가 한 개 있다면 이 전자가 받는 힘 (c) 처음에 이 전자가 양전하 극판에서 2.90 mm 떨어져 있다면, 음전하 극판으로 옮기려면 얼마만큼의 일을 해야 하는가?',
      defs: ['전위차: 두 점 사이 단위 전하당 위치 에너지의 차. 균일한 전기장에서 \\(|\\Delta V| = Ed\\).', '전기장 속 전하가 받는 힘: \\(F = qE\\).'],
      steps: [
        '(a) \\(E = \\dfrac{\\Delta V}{d} = \\dfrac{600}{5.33\\times10^{-3}} = 1.13\\times10^5\\ \\mathrm{V/m}\\)',
        '(b) \\(F = eE = (1.60\\times10^{-19})(1.13\\times10^5) = 1.80\\times10^{-14}\\ \\mathrm N\\) (양극판 쪽으로)',
        '(c) 음극판까지 남은 거리 \\(5.33 - 2.90 = 2.43\\ \\mathrm{mm}\\). 전자는 양극판 쪽으로 끌리므로 반대로 밀어야 한다.',
        '\\(W = Fd = (1.80\\times10^{-14})(2.43\\times10^{-3}) = 4.38\\times10^{-17}\\ \\mathrm J\\)'
      ],
      answer: '(a) \\(1.13\\times10^5\\ \\mathrm{N/C}\\) · (b) \\(1.80\\times10^{-14}\\ \\mathrm N\\) · (c) \\(4.38\\times10^{-17}\\ \\mathrm J\\)',
      check: '\\(\\dfrac{\\mathrm V}{\\mathrm m} = \\dfrac{\\mathrm N}{\\mathrm C}\\); \\(\\mathrm C\\cdot\\mathrm{N/C} = \\mathrm N\\); \\(\\mathrm N\\cdot\\mathrm m = \\mathrm J\\)',
      trap: '(c)의 거리는 2.90 mm가 아니라 남은 거리 2.43 mm. mm → m.' },
    { ch: 24, id: 'e2410', tag: '연습 24장 10(12)', title: '정사각형 꼭짓점의 전위와 전위차', fig: 'e2410',
      why: '연결: 연습 7(8). 점전하 전위를 스칼라로 더하고, 전위차 = 나중 − 처음.',
      text: '\\(Q = +5.00\\ \\mathrm{nC}\\)인 전하 Q와 2Q가 그림처럼 거리 d = 2.00 cm 떨어져 있다(한 변 d인 정사각형의 아래 두 꼭짓점). 이때 (a) A에서의 전위 (b) B에서의 전위 (c) B와 A 사이의 전위차를 구하라.',
      defs: ['전위: 그 위치에서의 단위 전하당 위치 에너지. 점전하 \\(V = k_eq/r\\), 여러 개는 스칼라 합.', '전위차: \\(\\Delta V = V_B - V_A\\) (나중 − 처음).'],
      steps: [
        '\\(\\dfrac{k_eQ}{d} = \\dfrac{(8.99\\times10^9)(5.00\\times10^{-9})}{0.0200} = 2.25\\times10^3\\ \\mathrm V\\)',
        '(a) A: Q까지 d, 2Q까지 \\(\\sqrt2 d\\). \\(V_A = \\dfrac{k_eQ}{d}\\left(1 + \\dfrac{2}{\\sqrt2}\\right) = (2.25\\times10^3)(2.414) = 5.43\\times10^3\\ \\mathrm V\\)',
        '(b) B: Q까지 \\(\\sqrt2 d\\), 2Q까지 d. \\(V_B = \\dfrac{k_eQ}{d}\\left(\\dfrac{1}{\\sqrt2} + 2\\right) = (2.25\\times10^3)(2.707) = 6.08\\times10^3\\ \\mathrm V\\)',
        '(c) \\(\\Delta V_{BA} = V_B - V_A = 6.08 - 5.43 = 0.658\\ \\mathrm{kV} = 658\\ \\mathrm V\\)'
      ],
      answer: '(a) 5.43 kV · (b) 6.08 kV · (c) 658 V',
      check: '\\(\\dfrac{\\mathrm{N\\,m^2}}{\\mathrm{C^2}}\\cdot\\dfrac{\\mathrm C}{\\mathrm m} = \\mathrm{J/C} = \\mathrm V\\)',
      trap: '그림의 어느 꼭짓점이 Q, 2Q인지 교재 그림 P24.10과 한 번 대조할 것(여기서는 A가 Q 위, B가 2Q 위). 대각선 거리 √2 d.' },
    { ch: 24, id: 'e246', tag: '연습 24장 6(7)', title: '정삼각형 중심의 전위',
      why: '연결: 예제 24.3. "P점에 아무것도 없다고 보고 전위부터" 계산하는 연습.',
      text: '세 개의 양전하 Q, Q, 2Q가 한 변 d인 정삼각형의 꼭짓점에 놓여 있다. 삼각형 중심에서의 전위를 구하라. (전위의 기준은 r = ∞에서 V = 0)',
      defs: ['점전하 전위: \\(V = k_eq/r\\), 여러 전하는 스칼라 합(방향 없음).'],
      steps: [
        '정삼각형 중심에서 꼭짓점까지 거리: \\(r = \\dfrac{d}{\\sqrt3}\\)',
        '세 거리가 같으므로 전하만 더하면 된다: \\(V = k_e\\dfrac{Q + Q + 2Q}{d/\\sqrt3} = \\dfrac{4\\sqrt3\\,k_eQ}{d}\\)',
        '\\(V = 6.93\\,\\dfrac{k_eQ}{d}\\)'
      ],
      answer: '\\(V = \\dfrac{4\\sqrt3\\,k_eQ}{d} \\approx 6.93\\,\\dfrac{k_eQ}{d}\\)',
      check: '\\(\\dfrac{\\mathrm{N\\,m^2}}{\\mathrm{C^2}}\\cdot\\dfrac{\\mathrm C}{\\mathrm m} = \\mathrm V\\)',
      trap: '전기장이었다면 벡터라 상쇄를 따져야 하지만, 전위는 스칼라라 그냥 더한다. 중심 거리 d/√3을 외워 두면 빠르다.' },
    { ch: 24, id: 'e2417', tag: '연습 24장 17(22)', title: 'V–x 그래프에서 E_x 그래프 (18(24)의 쌍둥이)',
      why: '연결: 찍은 문제 18(24). 같은 쪽 바로 위 문제라 같이 연습.',
      text: '전기장이 x축과 평행할 때 x 좌표에 따른 전위 변화 그래프가 0~1 cm에서 0 → 20 V, 1~3 cm에서 20 V 일정, 3~4 cm에서 20 → 0 V이다. 이 영역에서 x 좌표에 따른 전기장의 x 성분을 그래프로 그리라.',
      defs: ['전위와 전기장의 관계: \\(E_x = -\\dfrac{dV}{dx}\\) (기울기에 마이너스).'],
      steps: [
        '0~1 cm: 기울기 \\(\\dfrac{20}{0.01} = +2000\\ \\mathrm{V/m}\\) → \\(E_x = -2000\\ \\mathrm{V/m}\\)',
        '1~3 cm: 기울기 0 → \\(E_x = 0\\)',
        '3~4 cm: 기울기 −2000 → \\(E_x = +2000\\ \\mathrm{V/m}\\)'
      ],
      answer: '\\(E_x\\) = −2000 V/m (0~1 cm), 0 (1~3 cm), +2000 V/m (3~4 cm) — 계단 그래프',
      check: '\\(\\mathrm{V/m} = \\mathrm{N/C}\\)',
      trap: '전위가 일정한 구간(등전위)에서는 전기장이 0이다.' },

    /* ---------------- 25 ---------------- */
    { ch: 25, id: 'e254', tag: '연습 25장 4(4)', title: '평행판 축전기의 용량, 전하, 전기장',
      why: '연결: Q = CΔV와 평행판 C = ε₀A/d. 25장 모든 문제의 출발점.',
      text: '공기가 채워져 있는 평행판 축전기에서 판의 넓이는 2.30 cm²이고 판 사이의 거리는 1.50 mm이다. (a) 전기용량 (b) 축전기의 전위차가 12.0 V일 때 축전기의 전하량 (c) 판 사이의 균일한 전기장의 크기를 구하라.',
      defs: ['전기용량: \\(C = Q/\\Delta V\\). 평행판 \\(C = \\varepsilon_0A/d\\).'],
      steps: [
        '단위 변환: \\(A = 2.30\\ \\mathrm{cm^2} = 2.30\\times10^{-4}\\ \\mathrm{m^2}\\), \\(d = 1.50\\times10^{-3}\\ \\mathrm m\\)',
        '(a) \\(C = \\dfrac{\\varepsilon_0A}{d} = \\dfrac{(8.85\\times10^{-12})(2.30\\times10^{-4})}{1.50\\times10^{-3}} = 1.36\\times10^{-12}\\ \\mathrm F = 1.36\\ \\mathrm{pF}\\)',
        '(b) \\(Q = C\\Delta V = (1.36\\times10^{-12})(12.0) = 1.63\\times10^{-11}\\ \\mathrm C = 16.3\\ \\mathrm{pC}\\)',
        '(c) \\(E = \\dfrac{\\Delta V}{d} = \\dfrac{12.0}{1.50\\times10^{-3}} = 8.00\\times10^3\\ \\mathrm{V/m}\\)'
      ],
      answer: '(a) 1.36 pF · (b) 16.3 pC · (c) \\(8.00\\times10^3\\ \\mathrm{V/m}\\)',
      check: '\\(\\dfrac{\\mathrm{C^2}}{\\mathrm{N\\,m^2}}\\cdot\\dfrac{\\mathrm{m^2}}{\\mathrm m} = \\dfrac{\\mathrm C}{\\mathrm V} = \\mathrm F\\); \\(\\mathrm{F\\cdot V = C}\\)',
      trap: 'cm² → ×10⁻⁴ m² (×10⁻²가 아니다).' },
    { ch: 25, id: 'e2510', tag: '연습 25장 10(11)', title: '네 축전기의 등가 용량과 각 전하량', fig: 'e2510',
      why: '연결: 예제 25.3(부분부분 합산). 10/1: "부분적으로 가서 병렬은 더하고 직렬은 역수로."',
      text: '그림 P25.10과 같이 네 개의 축전기(15.0 μF, 3.00 μF, 6.00 μF, 20.0 μF)가 연결되어 있다. (a) 점 a와 b 사이의 등가 전기용량을 계산하라. (b) 점 a와 b 사이의 전위차 \\(\\Delta V_{ab}\\)가 15.0 V일 때 각 축전기의 전하량을 구하라.',
      defs: ['등가 전기용량: 병렬은 \\(C = C_1 + C_2\\)(전위차 같음), 직렬은 \\(1/C = 1/C_1 + 1/C_2\\)(전하량 같음).'],
      steps: [
        '15.0 μF와 3.00 μF 직렬: \\(\\dfrac{1}{C_s} = \\dfrac1{15.0} + \\dfrac1{3.00}\\Rightarrow C_s = 2.50\\ \\mu\\mathrm F\\)',
        '그것과 6.00 μF 병렬: \\(C_p = 2.50 + 6.00 = 8.50\\ \\mu\\mathrm F\\)',
        '(a) 20.0 μF와 직렬: \\(\\dfrac1{C} = \\dfrac1{8.50} + \\dfrac1{20.0}\\Rightarrow C = 5.96\\ \\mu\\mathrm F\\)',
        '(b) 전체 전하 \\(Q = C\\Delta V = (5.96)(15.0) = 89.5\\ \\mu\\mathrm C\\) → 직렬인 20.0 μF에도 89.5 μC',
        '병렬 묶음의 전위차: \\(\\dfrac{89.5}{8.50} = 10.5\\ \\mathrm V\\) → 6.00 μF: \\(Q = (6.00)(10.5) = 63.2\\ \\mu\\mathrm C\\)',
        '15.0 μF와 3.00 μF(직렬, 2.50 μF): \\(Q = (2.50)(10.5) = 26.3\\ \\mu\\mathrm C\\) — 둘 다 같은 전하'
      ],
      answer: '(a) 5.96 μF · (b) 20.0 μF: 89.5 μC, 6.00 μF: 63.2 μC, 15.0 μF와 3.00 μF: 각 26.3 μC',
      check: 'μF × V = μC',
      trap: '연결 구조는 교재 그림 P25.10과 대조할 것(여기서는 15와 3이 직렬, 그것이 6과 병렬, 다시 20과 직렬). 직렬이면 전하가 같고 병렬이면 전위차가 같다.' },
    { ch: 25, id: 'e2516', tag: '연습 25장 16(18)', title: '직렬 축전기에 저장된 에너지',
      why: '연결: U = Q²/2C = ½CΔV² (유도 강조, 10/1).',
      text: '전기용량이 각각 \\(C_1 = 18.0\\ \\mu\\mathrm F\\)와 \\(C_2 = 36.0\\ \\mu\\mathrm F\\)인 두 개의 축전기를 직렬 연결하고, 12.0 V 전지를 연결하여 충전시킨다. (a) 등가 전기용량 (b) 등가 전기용량에 저장된 에너지 (c) 각 축전기에 저장된 에너지 (d) 두 에너지를 더하면 (b)와 같음을 보이라.',
      defs: ['직렬: 전하량이 같고 \\(1/C = 1/C_1 + 1/C_2\\).', '저장 에너지: \\(U = \\dfrac{Q^2}{2C} = \\tfrac12C(\\Delta V)^2\\).'],
      steps: [
        '(a) \\(\\dfrac1C = \\dfrac1{18.0} + \\dfrac1{36.0}\\Rightarrow C = 12.0\\ \\mu\\mathrm F\\)',
        '(b) \\(U = \\tfrac12C(\\Delta V)^2 = \\tfrac12(12.0\\times10^{-6})(12.0)^2 = 8.64\\times10^{-4}\\ \\mathrm J = 864\\ \\mu\\mathrm J\\)',
        '직렬이라 전하가 같다: \\(Q = C\\Delta V = (12.0)(12.0) = 144\\ \\mu\\mathrm C\\)',
        '(c) \\(U_1 = \\dfrac{Q^2}{2C_1} = \\dfrac{(144\\times10^{-6})^2}{2(18.0\\times10^{-6})} = 576\\ \\mu\\mathrm J\\), \\(U_2 = \\dfrac{(144\\times10^{-6})^2}{2(36.0\\times10^{-6})} = 288\\ \\mu\\mathrm J\\)',
        '(d) \\(576 + 288 = 864\\ \\mu\\mathrm J\\) ✓'
      ],
      answer: '(a) 12.0 μF · (b) 864 μJ · (c) 576 μJ, 288 μJ · (d) 합 864 μJ',
      check: '\\(\\mathrm F\\cdot\\mathrm V^2 = \\mathrm{C\\,V} = \\mathrm J\\); \\(\\mathrm{C^2/F} = \\mathrm{C\\,V} = \\mathrm J\\)',
      trap: '직렬에서는 전하가 같으므로 Q²/2C 형태가 편하다(병렬이면 ½CΔV²가 편하다).' },
    { ch: 25, id: 'e2522', tag: '연습 25장 22(26)', title: '유전체를 넣었을 때 전압 변화로 유전 상수 구하기',
      why: '연결: 유전체 효과 ΔV = ΔV₀/κ (10/1 "전이차는 κ에 반비례").',
      text: '공기가 차 있는 평행판 축전기에 걸린 전압이 85.0 V이다. 판 사이에 유전체를 삽입하면 전압이 25.0 V로 떨어진다. (a) 삽입된 물질의 유전 상수는 얼마인가? (b) 이 물질은 무엇일까?',
      defs: ['유전체: 비전도성 물질. 고립된(전하가 일정한) 축전기에 넣으면 \\(\\Delta V = \\Delta V_0/\\kappa\\)로 감소, \\(C = \\kappa C_0\\)로 증가.'],
      steps: [
        '전지에 연결되지 않은 상태라 전하 Q가 일정하다.',
        '(a) \\(\\kappa = \\dfrac{\\Delta V_0}{\\Delta V} = \\dfrac{85.0}{25.0} = 3.40\\)',
        '(b) 표 25.1에서 κ ≈ 3.4인 물질 → 나일론'
      ],
      answer: '(a) κ = 3.40 · (b) 나일론',
      check: 'V/V → 단위 없음 (유전 상수는 무차원)',
      trap: '전지에 계속 연결되어 있었다면 ΔV가 일정하고 Q가 κ배로 늘어난다. 어느 쪽이 일정한지 먼저 판단.' },

    /* ---------------- 26 ---------------- */
    { ch: 26, id: 'e269', tag: '연습 26장 9(10)', title: '저항 측정으로 금속 알아내기',
      why: '연결: 비저항은 "물질 고유의 값"(10/8). "비저항을 재면 어떤 물질인지 거꾸로 알 수 있다"를 그대로 계산.',
      text: '길이가 50.0 m이고 지름이 2.00 mm인 도선을 전위차가 9.11 V인 전원에 연결하니 36.0 A의 전류가 흐른다. 온도가 20.0°C라고 가정하고 표 26.2를 사용하여 이 도선이 어떤 금속으로 만들어졌는지 알아보라.',
      defs: ['저항: \\(R = \\Delta V/I\\).', '비저항: 전류 흐름을 방해하는 정도를 수치화한 물질 고유의 값. \\(R = \\rho\\ell/A\\).'],
      steps: [
        '\\(R = \\dfrac{\\Delta V}{I} = \\dfrac{9.11}{36.0} = 0.253\\ \\Omega\\)',
        '단면적(반지름 1.00 mm): \\(A = \\pi(1.00\\times10^{-3})^2 = 3.14\\times10^{-6}\\ \\mathrm{m^2}\\)',
        '\\(\\rho = \\dfrac{RA}{\\ell} = \\dfrac{(0.253)(3.14\\times10^{-6})}{50.0} = 1.59\\times10^{-8}\\ \\Omega\\cdot\\mathrm m\\)',
        '표 26.2에서 \\(1.59\\times10^{-8}\\ \\Omega\\cdot\\mathrm m\\) → 은(Ag)'
      ],
      answer: '\\(\\rho = 1.59\\times10^{-8}\\ \\Omega\\cdot\\mathrm m\\) → 은',
      check: '\\(\\Omega\\cdot\\dfrac{\\mathrm{m^2}}{\\mathrm m} = \\Omega\\cdot\\mathrm m\\)',
      trap: '지름 2.00 mm → 반지름 1.00 mm. 지름을 그대로 넣으면 4배 틀린다.' },
    { ch: 26, id: 'e264', tag: '연습 26장 4(4)', title: '구리 도선 속 전자의 유동 속력',
      why: '연결: 예제 26.1, I = nqv_dA(10/6 수업에서 "실제로는 이렇게 느리다"를 강조).',
      text: '어떤 구리 도선의 단면은 반지름이 1.25 mm인 원형이다. (a) 이 도선에 3.70 A의 전류가 흐를 때 도선 내 전자의 유동 속력을 구하라. (b) 다른 조건이 동일하지만 도선이 원자 하나당 자유 전자 수가 구리보다 많은 다른 금속으로 만들어져 있으면 유동 속력은 어떻게 변하는가?',
      defs: ['유동 속도: 전기장이 걸렸을 때 전하 운반자가 충돌하면서도 평균적으로 한 방향으로 흘러가는 평균 속도.', '미시적 전류: \\(I = nqv_dA\\).'],
      steps: [
        '구리의 자유 전자 밀도(예제 26.1): \\(n = 8.46\\times10^{28}\\ \\mathrm{m^{-3}}\\)',
        '\\(A = \\pi(1.25\\times10^{-3})^2 = 4.91\\times10^{-6}\\ \\mathrm{m^2}\\)',
        '(a) \\(v_d = \\dfrac{I}{nqA} = \\dfrac{3.70}{(8.46\\times10^{28})(1.60\\times10^{-19})(4.91\\times10^{-6})} = 5.57\\times10^{-5}\\ \\mathrm{m/s}\\)',
        '(b) n이 커지면 같은 전류에서 \\(v_d = I/(nqA)\\)는 작아진다.'
      ],
      answer: '(a) \\(5.57\\times10^{-5}\\ \\mathrm{m/s}\\) · (b) 더 느려진다 (n에 반비례)',
      check: '\\(\\dfrac{\\mathrm A}{\\mathrm{m^{-3}}\\cdot\\mathrm C\\cdot\\mathrm{m^2}} = \\dfrac{\\mathrm{C/s}}{\\mathrm{C/m}} = \\mathrm{m/s}\\)',
      trap: 'n을 주지 않으면 밀도·몰 질량·아보가드로수로 계산한다(1원자당 자유 전자 1개).' },
    { ch: 26, id: 'e2617', tag: '연습 26장 17(18)', title: '온도에 따른 저항 변화로 필라멘트 온도 구하기',
      why: '연결: 저항의 온도 의존성(10/8 "온도에 따라 저항이 바뀐다, 금속은 늘어난다").',
      text: '전구 안 텅스텐 필라멘트의 저항이 20.0°C에서는 19.0 Ω이고, 뜨거울 때는 140 Ω이다. 매우 높은 온도에서도 텅스텐 필라멘트의 비저항이 온도에 따라 선형으로 변한다고 할 때, 뜨거운 필라멘트의 온도를 구하라. (텅스텐 \\(\\alpha = 4.5\\times10^{-3}\\ /^\\circ\\mathrm C\\))',
      defs: ['저항의 온도 의존: \\(R = R_0[1 + \\alpha(T - T_0)]\\). 금속은 온도가 오르면 저항이 증가한다.'],
      steps: [
        '\\(140 = 19.0[1 + (4.5\\times10^{-3})(T - 20.0)]\\)',
        '\\(\\dfrac{140}{19.0} - 1 = 6.37 = (4.5\\times10^{-3})(T - 20.0)\\)',
        '\\(T - 20.0 = 1.42\\times10^3\\ ^\\circ\\mathrm C\\) → \\(T = 1.44\\times10^3\\ ^\\circ\\mathrm C\\)'
      ],
      answer: '\\(T \\approx 1.44\\times10^3\\ ^\\circ\\mathrm C\\)',
      check: 'α[1/°C] × ΔT[°C] → 무차원. 괄호 안이 무차원이어야 한다.',
      trap: 'ΔT를 구한 뒤 처음 온도 20.0°C를 더하는 것을 잊지 말 것.' },
    { ch: 26, id: 'e2622', tag: '연습 26장 22(25)', title: '전압이 올라갈 때 전력 변화율',
      why: '연결: P = (ΔV)²/R(10/8 "병렬일 때는 전압이 일정해서 이 형태를 쓴다").',
      text: '120 V의 전원에 연결된 100 W짜리 전구에 순간적으로 전압이 140 V로 급증한다. 전구의 전력은 몇 %나 변하는가? 저항은 변하지 않는다고 가정한다.',
      defs: ['전력: 단위 시간당 전달되는 전기 에너지. \\(P = I\\Delta V = (\\Delta V)^2/R\\).'],
      steps: [
        'R이 일정하면 \\(P\\propto(\\Delta V)^2\\)',
        '\\(\\dfrac{P_2}{P_1} = \\left(\\dfrac{140}{120}\\right)^2 = 1.36\\)',
        '변화율 = 1.36 − 1 = 0.361 → 36.1% 증가 (P₂ ≈ 136 W)'
      ],
      answer: '약 36.1% 증가',
      check: '\\(\\mathrm{V^2/\\Omega = V\\cdot A = W}\\)',
      trap: '전압이 16.7% 올랐다고 전력도 16.7%가 아니다. 제곱에 비례.' },

    /* ---------------- 27 ---------------- */
    { ch: 27, id: 'e2729', tag: '연습 27장 29(33)', title: '직·병렬이 섞인 회로의 등가 저항', fig: 'e2729',
      why: '교재 필기가 바로 이 문제 옆에 적혀 있다. 연결: 저항 합성(축전기와 반대).',
      text: '그림 P27.29의 회로에서 점 a와 b 사이의 등가 저항을 구하라.',
      defs: ['직렬: \\(R = R_1 + R_2\\) (전류 같음). 병렬: \\(1/R = 1/R_1 + 1/R_2\\) (전압 같음).'],
      steps: [
        '오른쪽 5.10 Ω과 3.50 Ω은 직렬: \\(8.60\\ \\Omega\\)',
        '그것과 1.80 Ω이 같은 두 마디 사이 → 병렬: \\(\\dfrac{(1.80)(8.60)}{1.80 + 8.60} = 1.49\\ \\Omega\\)',
        '2.40 Ω, 1.49 Ω, 3.60 Ω 직렬: \\(R_{ab} = 2.40 + 1.49 + 3.60 = 7.49\\ \\Omega\\)'
      ],
      answer: '\\(R_{ab} = 7.49\\ \\Omega\\)',
      check: 'Ω끼리 합. 병렬 결과(1.49 Ω)는 두 저항 중 작은 것(1.80 Ω)보다 작아야 한다 ✓',
      trap: '안쪽부터 묶는다. 같은 두 마디 사이에 있는지로 병렬을 판단한다.' },
    { ch: 27, id: 'e2712', tag: '연습 27장 12(13)', title: '각 저항기에 공급되는 전력', fig: 'e2712',
      why: '연결: 등가 저항 → 전체 전류 → P = I²R. 직렬은 I²R, 병렬은 V²/R이 편하다(10/8).',
      text: '그림 P27.12의 회로에서 각 저항기에 공급되는 전력을 계산하라.',
      defs: ['직렬 R = R₁ + R₂, 병렬 1/R = 1/R₁ + 1/R₂.', '전력: \\(P = I^2R = (\\Delta V)^2/R\\).'],
      steps: [
        '3.00 Ω과 1.00 Ω 병렬: \\(\\dfrac{(3.00)(1.00)}{4.00} = 0.750\\ \\Omega\\)',
        '전체: \\(2.00 + 0.750 + 4.00 = 6.75\\ \\Omega\\), \\(I = \\dfrac{18.0}{6.75} = 2.67\\ \\mathrm A\\)',
        '2.00 Ω: \\(P = I^2R = (2.67)^2(2.00) = 14.2\\ \\mathrm W\\); 4.00 Ω: \\((2.67)^2(4.00) = 28.4\\ \\mathrm W\\)',
        '병렬부 전압: \\((2.67)(0.750) = 2.00\\ \\mathrm V\\) → 3.00 Ω: \\(\\dfrac{2.00^2}{3.00} = 1.33\\ \\mathrm W\\); 1.00 Ω: \\(\\dfrac{2.00^2}{1.00} = 4.00\\ \\mathrm W\\)',
        '검산: 합 14.2 + 28.4 + 1.33 + 4.00 = 48.0 W = εI = (18.0)(2.67) ✓'
      ],
      answer: '2.00 Ω: 14.2 W · 4.00 Ω: 28.4 W · 3.00 Ω: 1.33 W · 1.00 Ω: 4.00 W',
      check: '\\(\\mathrm A^2\\cdot\\Omega = \\mathrm W\\), \\(\\mathrm V^2/\\Omega = \\mathrm W\\)',
      trap: '회로 연결은 교재 그림 P27.12와 대조할 것(2.00 Ω과 4.00 Ω 직렬, 3.00 Ω과 1.00 Ω 병렬). 전체 전력 = 전지가 공급한 전력으로 검산.' },
    { ch: 27, id: 'e2721', tag: '연습 27장 21(23)', title: 'RC 충전: 시간 상수, 최대 전하, τ 후 전하',
      why: '연결: 연습 23(25)·예제 27.7. 10/15: "시상수 구하라 → 최대 전하 → 함수" 순서로 물어본다.',
      text: '충전되지 않은 축전기와 저항기가 기전력원에 직렬 연결되어 있다. ε = 9.00 V, C = 20.0 μF, R = 100 Ω일 때 (a) 회로의 시간 상수 (b) 축전기에 충전된 최대 전하량 (c) 전지에 연결된 후 시간 상수만큼 시간이 지났을 때 축전기에 충전된 전하량을 구하라.',
      defs: ['시간 상수: 전류가 처음 값의 1/e로 감소하는 데 걸리는 시간. τ = RC.', 'RC 충전: \\(q(t) = C\\varepsilon(1 - e^{-t/RC})\\).'],
      steps: [
        '(a) \\(\\tau = RC = (100)(20.0\\times10^{-6}) = 2.00\\times10^{-3}\\ \\mathrm s = 2.00\\ \\mathrm{ms}\\)',
        '(b) \\(Q_{\\max} = C\\varepsilon = (20.0\\times10^{-6})(9.00) = 1.80\\times10^{-4}\\ \\mathrm C = 180\\ \\mu\\mathrm C\\)',
        '(c) t = τ: \\(q = Q_{\\max}(1 - e^{-1}) = (180)(0.632) = 114\\ \\mu\\mathrm C\\)'
      ],
      answer: '(a) 2.00 ms · (b) 180 μC · (c) 114 μC (최대의 63.2%)',
      check: '\\(\\Omega\\cdot\\mathrm F = \\mathrm s\\); \\(\\mathrm{F\\cdot V = C}\\)',
      trap: '"시간 상수만큼 지나면 63%"를 외워 두면 (c)는 바로 나온다.' },
    { ch: 27, id: 'e2725', tag: '연습 27장 25(27)', title: '충전 중 전위차로 저항값 구하기 (ln 쓰기)',
      why: '연결: 예제 27.8의 비율 문제. 10/15: "지수를 없애려면 거꾸로 로그를 취하는 수밖에 없다."',
      text: '전기용량이 10.0 μF인 축전기에 저항이 R인 저항기를 직렬로 연결하고 10.0 V 전지로 충전한다. 충전이 시작된 지 3.00 s 후 축전기 양단의 전위차는 4.00 V가 된다. R 값을 계산하라.',
      defs: ['RC 충전: \\(q = C\\varepsilon(1 - e^{-t/RC})\\), 축전기 전압 \\(\\Delta V_C = q/C = \\varepsilon(1 - e^{-t/RC})\\).'],
      steps: [
        '\\(4.00 = 10.0(1 - e^{-3.00/RC})\\Rightarrow e^{-3.00/RC} = 0.600\\)',
        '양변에 ln: \\(-\\dfrac{3.00}{RC} = \\ln0.600 = -0.511\\Rightarrow RC = 5.87\\ \\mathrm s\\)',
        '\\(R = \\dfrac{5.87}{10.0\\times10^{-6}} = 5.87\\times10^5\\ \\Omega = 587\\ \\mathrm{k\\Omega}\\)'
      ],
      answer: '\\(R = 5.87\\times10^5\\ \\Omega\\) (587 kΩ)',
      check: '\\(\\dfrac{\\mathrm s}{\\mathrm F} = \\dfrac{\\mathrm s}{\\mathrm{C/V}} = \\dfrac{\\mathrm V}{\\mathrm{C/s}} = \\dfrac{\\mathrm V}{\\mathrm A} = \\Omega\\)',
      trap: '4.00 V는 축전기 전압이다(충전식). 저항 전압(10.0 − 4.00)과 헷갈리지 말 것.' }
  ];


  const FIGS = Object.assign({}, FIGS_A, FIGS_B);
  const P = P_A.concat(P_B);
  const byId = id => P.find(p => p.id === id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let st = {}; try { st = JSON.parse(store.get('sheet-state') || '{}') || {}; } catch (e) { st = {}; }
  const DAYS = [
    { k: 'd1', name: '1일차', chs: [22, 23] },
    { k: 'd2', name: '2일차', chs: [24, 25] },
    { k: 'd3', name: '3일차', chs: [26, 27] }
  ];
  let tab = store.get('sheet-tab') || 'd1';
  const open = {};
  const main = document.getElementById('main');
  const tabsEl = document.getElementById('tabs');
  const isProf = p => p.id[0] === 'p';
  // 두 장을 번갈아 섞기: A1 B1 A2 B2 …
  function mixed(chs) {
    const a = P.filter(p => !isProf(p) && p.ch === chs[0]), b = P.filter(p => !isProf(p) && p.ch === chs[1]);
    const out = []; for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i]) out.push(a[i]); if (b[i]) out.push(b[i]); }
    return out;
  }
  const dayList = d => d.chs.flatMap(c => P.filter(p => isProf(p) && p.ch === c)).concat(mixed(d.chs));
  const badList = () => P.filter(p => st[p.id] === 'bad');

  function renderTabs() {
    tabsEl.innerHTML = '';
    const items = DAYS.map(d => { const l = dayList(d); return [d.k, `${d.name} · ${d.chs.join('·')}장`, `${l.filter(p => st[p.id] === 'ok').length}/${l.length}`]; });
    items.push(['bad', '다시 풀기', String(badList().length)]);
    items.forEach(([k, label, n]) => {
      const b = document.createElement('button');
      b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(k === tab));
      b.innerHTML = `${label}<span class="n">${n}</span>`;
      b.addEventListener('click', () => { tab = k; store.set('sheet-tab', k); render(); window.scrollTo({ top: 0 }); });
      tabsEl.appendChild(b);
      if (k === tab) setTimeout(() => b.scrollIntoView({ inline: 'center', block: 'nearest' }), 0);
    });
  }

  function card(p, mixNo) {
    const s = st[p.id] || '';
    const hideCh = mixNo && !open[p.id];
    const tag = hideCh ? `<span class="mixnum">섞기 ${mixNo}</span>` : `<span class="tag${p.hot ? ' hot' : ''}">${p.tag}</span>`;
    return `<article class="prob${s ? ' st-' + s : ''}" id="${p.id}" data-mix="${mixNo || ''}">
      <div class="p-head"><div class="titles"><div class="tags">${tag}</div>${hideCh ? '' : `<h3>${p.title}</h3>`}</div></div>
      <div class="text">${p.text}</div>
      ${p.fig ? `<div class="fig" data-fig="${p.fig}"></div>` : ''}
      <div class="mark">
        <button class="btn${open[p.id] ? '' : ' primary'}" type="button" data-ans="${p.id}" aria-expanded="${!!open[p.id]}">${open[p.id] ? '답 가리기' : '답 보기'}</button>
        <button class="btn ok" type="button" data-st="ok" data-id="${p.id}" aria-pressed="${s === 'ok'}">맞음</button>
        <button class="btn bad" type="button" data-st="bad" data-id="${p.id}" aria-pressed="${s === 'bad'}">틀림</button>
      </div>
      <div class="ans-box"${open[p.id] ? '' : ' hidden'}>
        <div class="answer">${p.answer}</div>
        ${p.check ? `<div class="ucheck">${p.check}</div>` : ''}
        <p class="where">풀이: ${isProf(p) ? '③ 교수님 찍은 문제' : '④ 추가 연습문제'} → ${p.ch}장 탭</p>
      </div>
    </article>`;
  }

  function render() {
    renderTabs();
    let html = '';
    if (tab === 'bad') {
      const l = badList();
      html = `<div class="sec"><div class="sec-h"><h2>다시 풀기</h2><small>틀림 표시한 문제</small></div>${l.length ? `<div class="list">${l.map(p => card(p)).join('')}</div>` : '<p class="empty">아직 틀림 표시한 문제가 없다. 다시 맞히면 맞음을 눌러 목록에서 빼자.</p>'}</div>`;
    } else {
      const d = DAYS.find(x => x.k === tab) || DAYS[0];
      d.chs.forEach(c => {
        const l = P.filter(p => isProf(p) && p.ch === c);
        html += `<div class="sec"><div class="sec-h"><h2>${c}장 · 찍은 문제</h2><small>${c}장 예제 끝나면 바로</small></div><div class="list">${l.map(p => card(p)).join('')}</div></div>`;
      });
      const m = mixed(d.chs);
      html += `<div class="sec"><div class="sec-h"><h2>마무리 · 추가 연습</h2><small>${d.chs.join('·')}장 섞음 · 하루 끝에</small></div><div class="list">${m.map((p, i) => card(p, i + 1)).join('')}</div></div>`;
    }
    main.innerHTML = html;
    main.querySelectorAll('[data-fig]').forEach(f => { const fn = FIGS[f.dataset.fig]; if (fn) f.appendChild(fn()); });
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([main]).catch(() => {});
  }

  function redraw(id) {
    const old = document.getElementById(id); if (!old) return;
    const wrap = document.createElement('div'); wrap.innerHTML = card(byId(id), +old.dataset.mix || 0);
    const n = wrap.firstElementChild; old.replaceWith(n);
    n.querySelectorAll('[data-fig]').forEach(f => { const fn = FIGS[f.dataset.fig]; if (fn) f.appendChild(fn()); });
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([n]).catch(() => {});
  }
  main.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    let id;
    if (b.dataset.ans) { id = b.dataset.ans; open[id] = !open[id]; }
    else if (b.dataset.st) { id = b.dataset.id; st[id] = st[id] === b.dataset.st ? undefined : b.dataset.st; if (!st[id]) delete st[id]; store.set('sheet-state', JSON.stringify(st)); renderTabs(); }
    else return;
    redraw(id);
  });

  render();
})();
</script>
